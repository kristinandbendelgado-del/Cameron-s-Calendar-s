<!DOCTYPE html>
<html lang="en">
<head>
  <title>Cameron's Calendars</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }
    h2 {
      margin: 0 0 20px 0;
      color: #1e293b;
      font-size: 24px;
      text-align: center;
      font-weight: 700;
    }
    label {
      font-weight: 600;
      display: block;
      margin: 18px 0 6px;
      color: #475569;
      font-size: 14px;
    }
    input[type="text"], input[type="date"] {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      background-color: #f8fafc;
      color: #334155;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, input[type="date"]:focus {
      outline: none;
      border-color: #3b82f6;
      background-color: white;
    }
    button {
      width: 100%;
      padding: 14px;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 20px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    #authBtn {
      background: #f59e0b;
      margin-top: 0;
      margin-bottom: 10px;
    }
    #authBtn:hover {
      background: #d97706;
    }
    #saveBtn {
      background: #3b82f6;
    }
    #saveBtn:hover {
      background: #2563eb;
    }
    button:active {
      transform: scale(0.98);
    }
    .status-card {
      margin-top: 25px;
      padding: 15px;
      background: #f1f5f9;
      border-radius: 8px;
      border-left: 4px solid #cbd5e1;
    }
    .status-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .event-list {
      max-height: 200px;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .event-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
      color: #334155;
    }
    .event-item:last-child {
      border-bottom: none;
    }
    .event-info {
      word-break: break-word;
      padding-right: 10px;
    }
    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      width: auto;
      margin-top: 0;
    }
    .delete-btn:hover {
      background: #dc2626;
    }
    .empty-text {
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Cameron's Calendars</h2>
    
    <button id="authBtn">Enable Notifications First</button>
    
    <label for="eventDate">Select Date</label>
    <input type="date" id="eventDate">
    
    <label for="eventTitle">Event Name</label>
    <input type="text" id="eventTitle" placeholder="What are you doing?">
    
    <button id="saveBtn">Save Event</button>
    
    <div class="status-card">
      <div class="status-title">Your Scheduled Events</div>
      <ul class="event-list" id="eventList"></ul>
    </div>
  </div>

  <script>
    const authBtn = document.getElementById("authBtn");
    const saveBtn = document.getElementById("saveBtn");
    const eventDateInput = document.getElementById("eventDate");
    const eventTitleInput = document.getElementById("eventTitle");
    const eventList = document.getElementById("eventList");

    if (Notification.permission === "granted" || Notification.permission === "denied") {
      authBtn.style.display = "none";
    }

    authBtn.addEventListener("click", () => {
      Notification.requestPermission().then(permission => {
        if (permission === "granted" || permission === "denied") {
          authBtn.style.display = "none";
        }
      });
    });

    function getEvents() {
      const data = localStorage.getItem("cameronCalendarEvents");
      return data ? JSON.parse(data) : [];
    }

    function saveEvents(eventsArray) {
      localStorage.setItem("cameronCalendarEvents", JSON.stringify(eventsArray));
    }

    function updateUI() {
      const events = getEvents();
      eventList.innerHTML = "";

      if (events.length === 0) {
        eventList.innerHTML = '<li class="empty-text">No upcoming events saved.</li>';
        document.querySelector(".status-card").style.borderLeftColor = "#cbd5e1";
        return;
      }

      document.querySelector(".status-card").style.borderLeftColor = "#3b82f6";

      events.forEach((item, index) => {
        const li = document.createElement("li");
        li.className = "event-item";

        const parts = item.date.split("-");
        const formattedDate = parts[1] + "/" + parts[2] + "/" + parts[0];

        const infoDiv = document.createElement("div");
        infoDiv.className = "event-info";
        infoDiv.innerText = `"${item.title}" on ${formattedDate}`;

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.innerText = "X";
        delBtn.addEventListener("click", () => {
          removeEvent(index);
        });

        li.appendChild(infoDiv);
        li.appendChild(delBtn);
        eventList.appendChild(li);
      });
    }

    saveBtn.addEventListener("click", () => {
      const dateVal = eventDateInput.value;
      const titleVal = eventTitleInput.value.trim();

      if (!dateVal || !titleVal) {
        alert("Please select a date and type an event name.");
        return;
      }

      const events = getEvents();
      events.push({
        title: titleVal,
        date: dateVal,
        notified: false
      });

      saveEvents(events);
      eventTitleInput.value = "";
      eventDateInput.value = "";
      updateUI();
    });

    function removeEvent(index) {
      const events = getEvents();
      events.splice(index, 1);
      saveEvents(events);
      updateUI();
    }

    function checkEvents() {
      const events = getEvents();
      let updated = false;

      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      const formattedToday = year + "-" + month + "-" + day;

      events.forEach(item => {
        if (item.date === formattedToday && !item.notified) {
          if (Notification.permission === "granted") {
            new Notification("Cameron's Calendars Reminder!", {
              body: "Don't forget: " + item.title
            });
            item.notified = true;
            updated = true;
          }
        }
      });

      if (updated) {
        saveEvents(events);
        updateUI();
      }
    }

    updateUI();
    setInterval(checkEvents, 60000);
    checkEvents();
  </script>

</body>
</html>
